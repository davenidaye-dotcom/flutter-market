<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <script>
    window.AliyunCaptchaConfig = { region: "cn", prefix: "1k5s16e" };
  </script>
  <style>
    html, body { margin: 0; background: transparent; font-family: sans-serif; }
    body { padding: 0 0 4px; }
    #captcha-element { width: 100%; min-height: 40px; display: flex; justify-content: center; }
    #aliyunCaptcha-sliding-slider,
    .aliyunCaptcha-sliding-slider {
      background-color: #4A89DC !important;
      border-color: #3A74C4 !important;
    }
    #aliyunCaptcha-sliding-slider *,
    .aliyunCaptcha-sliding-slider * {
      color: #fff !important;
      -webkit-text-fill-color: #fff !important;
      fill: #fff !important;
    }
    #button {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="captcha-element"></div>
  <button id="button" type="button" tabindex="-1" aria-hidden="true"></button>
  <script>
    function report(payload) {
      if (!window.AliyunCaptchaBridge) return false;
      AliyunCaptchaBridge.postMessage(JSON.stringify(payload));
      return true;
    }
    var puzzleMode = __PUZZLE_MODE__;
    var lastHeight = 0;
    var lastWidth = 0;
    var puzzleReadySent = false;
    function puzzleShown() {
      var text = document.body.innerText || "";
      if (text.indexOf("拼图") >= 0) return true;
      var imgs = document.getElementsByTagName("img");
      for (var i = 0; i < imgs.length; i++) {
        if (imgs[i].clientHeight > 80) return true;
      }
      return false;
    }
    function darkenHint() {
      if (!puzzleMode) return;
      var nodes = document.body.getElementsByTagName("*");
      for (var i = 0; i < nodes.length; i++) {
        var node = nodes[i];
        if (node.children.length > 0) continue;
        var text = (node.textContent || "").replace(/\s/g, "");
        if (text.indexOf("拖动滑块") < 0 && text.indexOf("完成拼图") < 0) continue;
        if (text.length > 20) continue;
        node.style.setProperty("color", "#5c5c5c", "important");
        node.style.setProperty("-webkit-text-fill-color", "#5c5c5c", "important");
      }
    }
    var pinCount = 0;
    function contentBounds() {
      var viewH = window.innerHeight || 420;
      var viewW = window.innerWidth || 320;
      var top = 0;
      var bottom = 0;
      var any = false;
      var nodes = document.body.getElementsByTagName("*");
      for (var i = 0; i < nodes.length; i++) {
        var node = nodes[i];
        if (node.id === "button") continue;
        var style = window.getComputedStyle(node);
        if (style.display === "none" || style.visibility === "hidden") continue;
        var rect = node.getBoundingClientRect();
        if (rect.height < 2 || rect.width < 2) continue;
        if (rect.height > viewH * 0.9 && rect.width > viewW * 0.9) continue;
        if (!any || rect.top < top) top = rect.top;
        if (!any || rect.bottom > bottom) bottom = rect.bottom;
        any = true;
      }
      return any ? { top: top, bottom: bottom } : null;
    }
    function hideLogo() {
      var nodes = document.getElementsByTagName("*");
      for (var i = 0; i < nodes.length; i++) {
        var node = nodes[i];
        var text = (node.innerText || node.textContent || "").replace(/\s/g, "");
        if (text.indexOf("点击开始验证") >= 0) continue;
        var cls = typeof node.className === "string" ? node.className.toLowerCase() : "";
        var id = (node.id || "").toLowerCase();
        var src = (node.getAttribute && node.getAttribute("src")) || "";
        var alt = (node.getAttribute && node.getAttribute("alt")) || "";
        var brand = text.indexOf("Alibaba") >= 0 || text.indexOf("阿里云") >= 0 || alt.indexOf("Alibaba") >= 0 || alt.indexOf("阿里") >= 0;
        var logo = cls.indexOf("logo") >= 0 || id.indexOf("logo") >= 0 || src.indexOf("logo") >= 0;
        if (brand || logo) node.style.setProperty("display", "none", "important");
      }
    }
    function puzzleBox() {
      var imgs = document.getElementsByTagName("img");
      var img = null;
      for (var i = 0; i < imgs.length; i++) {
        if (imgs[i].clientHeight > 80) img = imgs[i];
      }
      if (!img) return null;
      var node = img.parentElement;
      while (node && node !== document.body) {
        var text = node.innerText || "";
        if (text.indexOf("拼图") >= 0 && node.offsetHeight > 140 && node.offsetWidth > 140) return node;
        node = node.parentElement;
      }
      return img.parentElement;
    }
    function placePuzzle() {
      var box = puzzleBox();
      if (!box) return null;
      box.style.setProperty("position", "relative", "important");
      box.style.setProperty("left", "0px", "important");
      box.style.setProperty("top", "0px", "important");
      box.style.setProperty("right", "auto", "important");
      box.style.setProperty("bottom", "auto", "important");
      box.style.setProperty("transform", "none", "important");
      box.style.setProperty("margin", "0px", "important");
      var node = box.parentElement;
      while (node && node !== document.body) {
        var style = window.getComputedStyle(node);
        var mask = node.offsetWidth > window.innerWidth * 0.85 && node.offsetHeight > window.innerHeight * 0.85;
        if (mask) {
          node.style.setProperty("position", "static", "important");
          node.style.setProperty("background", "transparent", "important");
        } else if (style.position === "fixed" || style.position === "absolute") {
          node.style.setProperty("position", "relative", "important");
          node.style.setProperty("left", "0px", "important");
          node.style.setProperty("top", "0px", "important");
          node.style.setProperty("transform", "none", "important");
          node.style.setProperty("margin", "0px", "important");
        }
        node = node.parentElement;
      }
      return box;
    }
    function hideStart() {
      var nodes = document.getElementsByTagName("*");
      for (var i = 0; i < nodes.length; i++) {
        var node = nodes[i];
        var text = (node.innerText || node.textContent || "").replace(/\s/g, "");
        if (text.indexOf("点击开始验证") < 0 || text.length > 24) continue;
        node.style.setProperty("display", "none", "important");
      }
    }
    function pinPopup() {
      if (!puzzleShown() || pinCount > 3) return;
      var bounds = contentBounds();
      if (!bounds || Math.abs(bounds.top) < 2) return;
      var box = document.getElementById("captcha-element");
      if (!box) return;
      var current = parseFloat(box.style.marginTop || "0");
      if (isNaN(current)) current = 0;
      box.style.marginTop = (current - bounds.top) + "px";
      pinCount += 1;
    }
    var lastStage = "";
    function bindClose() {
      var nodes = document.getElementsByTagName("*");
      for (var i = 0; i < nodes.length; i++) {
        var node = nodes[i];
        if (node.getAttribute("data-close-bound")) continue;
        var text = (node.textContent || "").replace(/\s/g, "");
        var id = node.id || "";
        var cls = typeof node.className === "string" ? node.className : "";
        var isClose = text === "×" || text === "✕" || id.indexOf("close") >= 0 || cls.indexOf("close") >= 0;
        if (!isClose || text.length > 4) continue;
        node.setAttribute("data-close-bound", "1");
        node.addEventListener("click", function () {
          report({ ok: false, closed: true });
        });
      }
    }
    var slideTrack = __SLIDE_TRACK__;
    var slideInsetMin = 16;
    function slideSpan(viewW) {
      var width = slideTrack;
      var inset = Math.round((viewW - width) / 2);
      if (inset < slideInsetMin) {
        inset = slideInsetMin;
        width = Math.round(viewW - inset * 2);
      }
      if (width < 80) {
        width = viewW;
        inset = 0;
      }
      return { width: width, inset: inset };
    }
    function findBar(handle) {
      var ids = ["aliyunCaptcha-sliding-wrapper", "aliyunCaptcha-sliding-body"];
      var handleBox = handle.getBoundingClientRect();
      var handleMid = (handleBox.top + handleBox.bottom) / 2;
      for (var i = 0; i < ids.length; i++) {
        var node = document.getElementById(ids[i]);
        if (!node || node.offsetWidth < 80 || node.offsetHeight < 20) continue;
        var box = node.getBoundingClientRect();
        if (Math.abs((box.top + box.bottom) / 2 - handleMid) < 30) return node;
      }
      return null;
    }
    function insetSlide() {
      if (puzzleShown()) return;
      var viewW = document.documentElement.clientWidth || window.innerWidth;
      if (viewW < 80) return;
      var handle = document.getElementById("aliyunCaptcha-sliding-slider");
      if (!handle || handle.offsetWidth < 8) return;
      var bar = findBar(handle);
      if (!bar) return;
      var span = slideSpan(viewW);
      var handleBox = handle.getBoundingClientRect();
      var barBox = bar.getBoundingClientRect();
      var stick = barBox.left - handleBox.left;
      if (stick < 0) stick = 0;
      var target = Math.round(span.width - stick);
      if (target < 80) target = span.width;
      if (Math.abs(barBox.width - target) > 1) {
        bar.style.setProperty("width", target + "px", "important");
        bar.style.setProperty("min-width", target + "px", "important");
        bar.style.setProperty("max-width", target + "px", "important");
        bar.style.setProperty("box-sizing", "border-box", "important");
        bar.style.setProperty("margin-left", "0px", "important");
      }
      handleBox = handle.getBoundingClientRect();
      barBox = bar.getBoundingClientRect();
      var rightGap = viewW - Math.max(handleBox.right, barBox.right);
      var delta = span.inset - rightGap;
      if (Math.abs(delta) > 0.5) {
        var applied = parseFloat(bar.style.left || "0");
        if (isNaN(applied)) applied = 0;
        bar.style.setProperty("position", "relative", "important");
        bar.style.setProperty("left", (applied + delta) + "px", "important");
      }
    }
    function paintHandle() {
      var nodes = document.getElementsByTagName("*");
      for (var i = 0; i < nodes.length; i++) {
        var node = nodes[i];
        var id = node.id || "";
        var cls = typeof node.className === "string" ? node.className : "";
        var mark = id + " " + cls;
        if (mark.indexOf("slider") < 0) continue;
        if (mark.indexOf("text") >= 0 || mark.indexOf("wrapper") >= 0 || mark.indexOf("body") >= 0 || mark.indexOf("left") >= 0) continue;
        if (node.offsetWidth < 24 || node.offsetWidth > 72 || node.offsetHeight < 24 || node.offsetHeight > 56) continue;
        node.style.setProperty("background-color", "#4A89DC", "important");
        node.style.setProperty("border-color", "#3A74C4", "important");
        var kids = node.getElementsByTagName("*");
        for (var j = 0; j < kids.length; j++) {
          kids[j].style.setProperty("color", "#fff", "important");
          kids[j].style.setProperty("-webkit-text-fill-color", "#fff", "important");
          kids[j].style.setProperty("fill", "#fff", "important");
        }
      }
    }
    function publish() {
      hideLogo();
      paintHandle();
      var stage = puzzleShown() ? "puzzle" : "start";
      var box = null;
      if (stage === "puzzle") {
        hideStart();
        box = placePuzzle();
        bindClose();
      }
      var bounds = contentBounds();
      var h = stage === "start" ? 56 : 320;
      var w = 0;
      if (box) {
        h = Math.ceil(box.offsetHeight) + 8;
        w = Math.ceil(box.offsetWidth) + 8;
      } else if (bounds) {
        h = Math.ceil(bounds.bottom - bounds.top) + 8;
      }
      if (stage === "start") {
        document.body.style.display = "block";
        if (h > 72) h = 64;
      }
      if (stage === "puzzle") {
        document.body.style.display = "flex";
        document.body.style.justifyContent = "center";
        document.body.style.alignItems = "center";
        document.body.style.minHeight = "100%";
        document.body.style.margin = "0";
        if (h < 400) h = 400;
        if (w < 340) w = 340;
      }
      if (puzzleReadySent && stage === lastStage && Math.abs(h - lastHeight) < 2 && Math.abs(w - lastWidth) < 2) {
        darkenHint();
        return;
      }
      lastHeight = h;
      lastWidth = w;
      lastStage = stage;
      puzzleReadySent = true;
      report({ ok: false, ready: true, stage: stage, height: h, width: w });
      darkenHint();
    }
    var layoutObserver = null;
    function measure() {
      if (layoutObserver) layoutObserver.disconnect();
      try {
        publish();
      } finally {
        if (layoutObserver) {
          layoutObserver.observe(document.body, { childList: true, subtree: true, attributes: true });
        }
      }
    }
    window.addEventListener("resize", function () {
      setTimeout(publish, 60);
    });
    function slideLayout() {
      return { width: 320, rem: __CAPTCHA_REM__ };
    }
    function initCaptcha() {
      if (typeof window.initAliyunCaptcha !== "function") {
        report({ ok: false, msg: "安全验证加载失败" });
        return;
      }
      var layout = slideLayout();
      try {
        window.initAliyunCaptcha({
          SceneId: "__SCENE_ID__",
          mode: "embed",
          element: "#captcha-element",
          button: "#button",
          language: "cn",
          delayBeforeSuccess: false,
          rem: layout.rem,
          slideStyle: { width: layout.width, height: 40 },
          success: function (captchaVerifyParam) {
            report({ ok: true, param: captchaVerifyParam });
          },
          fail: function () {},
          getInstance: function (instance) {
            window.captcha = instance;
            publish();
          },
          onError: function (errorInfo) {
            var msg = (errorInfo && (errorInfo.msg || errorInfo.message)) || "安全验证加载失败";
            report({ ok: false, msg: String(msg) });
          }
        });
      } catch (e) {
        report({ ok: false, msg: "安全验证加载失败" });
      }
    }
    function loadSdk() {
      var script = document.createElement("script");
      script.src = "https://o.alicdn.com/captcha-frontend/aliyunCaptcha/AliyunCaptcha.js";
      script.onload = function () { initWhenSized(0); };
      script.onerror = function () { report({ ok: false, msg: "安全验证加载失败" }); };
      document.head.appendChild(script);
      setTimeout(function () {
        if (typeof window.initAliyunCaptcha !== "function") {
          report({ ok: false, msg: "安全验证加载失败" });
        }
      }, 8000);
    }
    function initWhenSized(tries) {
      var box = document.getElementById("captcha-element");
      var available = box ? box.clientWidth : 0;
      if (available < 8 && tries < 20) {
        setTimeout(function () { initWhenSized(tries + 1); }, 50);
        return;
      }
      initCaptcha();
    }
    function boot() {
      if (!window.AliyunCaptchaBridge) {
        setTimeout(boot, 50);
        return;
      }
      loadSdk();
      if (window.MutationObserver) {
        layoutObserver = new MutationObserver(function () { measure(); });
        layoutObserver.observe(document.body, { childList: true, subtree: true, attributes: true });
      }
    }
    boot();
  </script>
</body>
</html>
