<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <script>
    window.AliyunCaptchaConfig = { region: "cn", prefix: "1k5s16e" };
  </script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: transparent; }
    #captcha-element { width: 100%; height: 100%; }
    #button {
      position: absolute;
      left: 0;
      top: 0;
      width: 1px;
      height: 1px;
      margin: 0;
      padding: 0;
      border: 0;
      opacity: 0;
    }
  </style>
</head>
<body>
  <div id="captcha-element"></div>
  <button id="button" type="button" tabindex="-1" aria-hidden="true"></button>
  <script>
    function report(payload) {
      if (!window.AliyunCaptchaBridge) return;
      AliyunCaptchaBridge.postMessage(JSON.stringify(payload));
    }
    var sdkReady = false;
    var inited = false;
    var openRequested = false;
    var opened = false;
    function showOnce() {
      if (opened) return;
      var button = document.getElementById("button");
      if (!button) {
        report({ ok: false, closed: true, msg: "安全验证加载失败" });
        return;
      }
      opened = true;
      button.click();
      watchShown();
    }
    function watchShown() {
      var tries = 0;
      var timer = setInterval(function () {
        tries += 1;
        if (captchaVisible()) {
          clearInterval(timer);
          report({ ok: false, shown: true });
          return;
        }
        if (tries >= 40) clearInterval(timer);
      }, 200);
    }
    function captchaVisible() {
      var nodes = document.body.getElementsByTagName("*");
      for (var i = 0; i < nodes.length; i++) {
        var node = nodes[i];
        if (node.id === "button" || node.id === "captcha-element") continue;
        var rect = node.getBoundingClientRect();
        if (rect.width > 80 && rect.height > 30) return true;
      }
      return false;
    }
    function ensureInit() {
      if (window.captcha || inited) return;
      if (!sdkReady || typeof window.initAliyunCaptcha !== "function") return;
      inited = true;
      try {
        window.initAliyunCaptcha({
          SceneId: "1l8c7q1md",
          mode: "popup",
          element: "#captcha-element",
          button: "#button",
          language: "cn",
          success: function (captchaVerifyParam) {
            report({ ok: true, param: captchaVerifyParam });
          },
          fail: function () {},
          onClose: function () {
            report({ ok: false, closed: true });
          },
          getInstance: function (instance) {
            window.captcha = instance;
            report({ ok: false, ready: true });
            if (openRequested) showOnce();
          },
          onError: function (errorInfo) {
            var msg = (errorInfo && (errorInfo.msg || errorInfo.message)) || "安全验证加载失败";
            report({ ok: false, closed: true, msg: String(msg) });
          }
        });
      } catch (e) {
        report({ ok: false, closed: true, msg: "安全验证加载失败" });
      }
    }
    function openByJs() {
      openRequested = true;
      if (window.captcha) {
        showOnce();
        return;
      }
      ensureInit();
    }
    window.openByJs = openByJs;
    function loadSdk() {
      var script = document.createElement("script");
      script.src = "https://o.alicdn.com/captcha-frontend/aliyunCaptcha/AliyunCaptcha.js";
      script.onload = function () {
        sdkReady = true;
        if (openRequested) ensureInit();
      };
      script.onerror = function () {
        report({ ok: false, closed: true, msg: "安全验证加载失败" });
      };
      document.head.appendChild(script);
    }
    function boot() {
      if (!window.AliyunCaptchaBridge) {
        setTimeout(boot, 50);
        return;
      }
      loadSdk();
    }
    boot();
  </script>
</body>
</html>
