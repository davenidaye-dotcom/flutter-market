name: letou_app
description: 乐投 - 房间聊天下注应用
publish_to: 'none'
version: 100.3.19+1000319

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  crypto: ^3.0.6
  flutter_screenutil: ^5.9.3
  cached_network_image: ^3.4.1
  pin_code_fields: ^8.0.1
  shared_preferences: ^2.5.3
  flutter_easyloading: ^3.0.5
  easy_refresh: ^3.4.0
  intl: ^0.20.2
  equatable: ^2.0.7
  web_socket_channel: ^3.0.3
  flutter_native_splash: ^2.4.6
  encrypt: ^5.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/bootstrap/
    - assets/avatars/

# 原生启动页：由 flutter_native_splash 生成 Android/iOS 配置，避免手写 MainActivity/主题导致黑屏
flutter_native_splash:
  color: "#F0F8FF"
  android_12:
    color: "#F0F8FF"
  android: true
  ios: true
  web: false
